<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap');

    :root {
      --primary: #6366f1;
      --secondary: #0ea5e9;
      --accent: #f59e0b;
      --background: #020617;
      --foreground: #f8fafc;
      --glass: rgba(15, 23, 42, 0.6);
      --gradient-1: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    }

    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .text-gradient {
      background: var(--gradient-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
    }

    .btn-primary {
      background: var(--gradient-1) !important;
      padding: 12px 28px !important;
      border-radius: 50px !important;
      color: white !important;
      font-weight: 600 !important;
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
    }
  </style>

  <title>NEOClass | Elite E-Learning Academy</title>
  <meta name="description"
    content="NEOClass is a premium coaching center for IIT-JEE, NEET, and UPSC aspirants, providing world-class education with expert mentors.">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
